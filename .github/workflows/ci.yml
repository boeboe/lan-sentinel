name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs the same make targets as a developer machine. Go, golangci-lint
# and govulncheck come from the dev container (build/dev.Dockerfile).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: mod-verify, fmt-check, tidy-check, vet, lint, vuln, tests with race and coverage
        run: make mod-verify check
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make fuzz FUZZTIME=30s

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Network integration tests (Docker, CAP_NET_RAW only)
        run: make test-net
      - name: systemd unit test (privileged container)
        run: make test-systemd

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The daemon under a seeded storm for 3 minutes (race detector)
        run: make chaos CHAOS_DURATION=3m
      - name: Every test package in random order, twice at 1 and 4 CPUs (race detector)
        run: make stress STRESS_COUNT=2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos
          path: .build/chaos/
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Static linux/amd64 and linux/arm64 binaries, capcheck and the release tarballs
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
