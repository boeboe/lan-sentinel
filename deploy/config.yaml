# LAN Sentinel default configuration (Linux). Install: /etc/lan-sentinel/config.yaml
# Validate before rollout: lan-sentinel config validate --config /etc/lan-sentinel/config.yaml
# Every key and its default: lan-sentinel config show --sources
version: 1

interfaces:
  - name: eth0
    passive: { enabled: true, promiscuous: false }   # promiscuous only on a mirror/SPAN port
    active:  { enabled: false }                      # active discovery is off until reviewed per site
    # dhcp: { servers: [192.168.0.1] }               # allowed DHCP server identifiers (option 54); others raise
    #                                                # DHCP_SERVER_UNEXPECTED; [] expects none; unset: no verdict
  # - name: eth1
  #   passive: { enabled: true }
  #   active:
  #     enabled: true
  #     networks: [192.168.110.0/24]                 # explicitly configured networks only, /24 or narrower
  #     exclude:  [192.168.110.1]                    # never probed

passive:
  protocols: { arp: true, ipv4: true, ipv6: false, dhcp: true, mdns: true, dns: true, lldp: true }

# Probes on interfaces with active.enabled (defaults shown; budgets and
# limits: lan-sentinel config show --sources). Stop all probing at once:
# lan-sentinel active disable --reason "..."
# active:
#   arp:  { enabled: true,  interval: 5m }     # ARP sweep of the configured networks
#   icmp: { enabled: false, interval: 10m }    # known hosts only
#   tcp:
#     enabled: false
#     interval: 5m
#     targets: [{ port: 502, name: modbus, timeout: 750ms }]
#   udp: { enabled: false, interval: 15m, probes: [ntp, enip] }   # NTP, EtherNet/IP ListIdentity

storage:
  path: /data/lan-sentinel/hosts.db

api:
  socket: /run/lan-sentinel/api.sock
  listen: ""            # e.g. 127.0.0.1:9734 to serve /metrics

logging: { level: info, format: journald }
